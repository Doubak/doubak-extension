name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # 四个仓库并排检出——这就是本地的默认开发布局，也是不需要 submodule
      # 的原因（submodule 在浅 clone 下会留一个空目录，而打包脚本收得下空目录）。
      - uses: actions/checkout@v4
        with:
          path: doubak-extension

      - uses: actions/checkout@v4
        with:
          repository: Doubak/doubak-data-specs
          path: doubak-data-specs

      # **兄弟仓库是按各自的默认分支检出的。** 所以一次跨仓库的改动必须先合上游
      # （解析器 / 导出适配器 / 站点生成器），这里才可能绿——vendor 名单里新加的
      # 文件在上游合并之前根本不存在。`sync-vendor.mjs` 会把这句话直接报出来，
      # 而不是抛一串 ENOENT。
      #
      # 另外三个仓库也要在场：`src/vendor/` 是它们那些纯函数的**同一份**拷贝，
      # 而「同一份」这件事只有两边都在的时候才验得了。不检出的话那组测试会
      # 「带原因跳过」——跳过在本地合理，在 CI 里等于没测。
      - uses: actions/checkout@v4
        with:
          repository: Doubak/doubak-data-parser
          path: doubak-data-parser

      - uses: actions/checkout@v4
        with:
          repository: Doubak/doubak-export-adapters
          path: doubak-export-adapters

      - uses: actions/checkout@v4
        with:
          repository: Doubak/doubak-site-generator
          path: doubak-site-generator

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 规范的参考校验器需要 python3；一致性测试靠它。
      # 装 jsonschema 是为了让 schema 那一层也真的跑起来。
      - name: 安装校验依赖
        run: pip install jsonschema referencing

      # warcio 是可选的开发依赖，只用于独立验证 WARC 输出。
      # 不装的话那几个互操作测试会跳过——CI 里我们要它们真的跑。
      - name: 安装可选开发依赖
        working-directory: doubak-extension
        run: npm install

      - name: 跑测试
        working-directory: doubak-extension
        run: npm test

      # **换一个时区再跑一遍。**
      #
      # 这条是被真事逼出来的：一条断言写死了本地时区下的时刻，本地全绿、CI 全红
      # ——而那是运气好，CI 恰好在 UTC。要是 CI 也在同一个时区，这个 bug 会一直
      # 潜到某个用户那里才炸。UTC+14 与任何常见时区都差到日期本身都不同。
      - name: 换个时区再跑一遍
        working-directory: doubak-extension
        env:
          TZ: Pacific/Kiritimati
        run: npm test

      # 本地跑测试时，若规范仓库不在场，下面这些检查会「带原因跳过」。
      # 跳过在本地是合理的，在 CI 里则等于没测——所以显式再验一遍：
      # 规范仓库必须在，且生成的词表必须是最新的。
      - name: 确认跨仓库检查确实跑了而不是跳过了
        working-directory: doubak-extension
        run: |
          test -f ../doubak-data-specs/bundle/v1/validate.py || {
            echo '::error::规范仓库缺失，跨仓库测试会静默跳过'; exit 1; }
          for r in doubak-data-parser doubak-export-adapters doubak-site-generator; do
            test -d "../$r" || {
              echo "::error::$r 缺失，vendor 新鲜度检查会静默跳过"; exit 1; }
          done
          node tools/generate-spec-constants.mjs --check
          node tools/sync-vendor.mjs --check

      # 覆盖率用 Node 自带的，不装任何东西；上传是 curl 打 Coveralls 的
      # /jobs 端点，用 repo token 认证。**不引 coverallsapp/github-action**：
      # 它只认 github-token，还要把 @coveralls 以 Role: Write 请进仓库。
      #
      # 只在 push 上跑：fork 来的 PR 拿不到 secrets，脚本会硬失败（故意不静默
      # 跳过），在 PR 上就成了一个和代码无关的红叉。
      #
      # **排除项只有 test/** 一条**：排除项会烂掉，越少越好。测试文件按定义就是
      # ~100%，算进去只会把总数拖向 100% 并盖住 src 里的窟窿；而且完全不排除时
      # 这一步跑不完（实测 120 秒未结束，排除后 1 秒）。
      #
      # 真正该担心的是**没写出来的遗漏**：从没被任何测试 import 的文件根本不进
      # 分母，不是 0% 而是压根不存在。显式的排除项至少还看得见。
      - name: 覆盖率 → Coveralls
        if: github.event_name == 'push'
        working-directory: doubak-extension
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
        run: |
          node --test --experimental-test-coverage \
            --test-coverage-exclude='test/**' \
            --test-reporter=lcov --test-reporter-destination=lcov.info \
            --test-reporter=dot --test-reporter-destination=stdout \
            "test/**/*.test.js"
          node tools/coveralls.mjs lcov.info
