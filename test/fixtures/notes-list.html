<!--
  日记列表页 www.douban.com/people/<user>/notes

  结构按一份真实页面（2026-08-06 抓的）**逐处核对**过：条目容器、标题锚、日期格式、
  侧栏板块，全都是原样。两条日记是档案主人自己的公开内容，保留原文。

  **侧栏那三条是合成的。** 真实页面上「最近回应过的日记」列着 6 篇他人的日记，
  带着他们的用户名、头像与主页链接——那是第三方内容，不进公开仓库。这里换成假名假号，
  但把要害的结构原样留着：`link2/?url=` 外壳 + 百分号编码的 `%2Fnote%2FN%2F`。
  那个外壳正是「今天扫 /note/(\d+)/ 碰巧扫不到侧栏」的原因，而这个夹具要守住的恰恰是
  「不许依赖那份运气」。

  真实页面上没有翻页器——两条日记一页就装下了。所以每页装几条是未知的，
  路线用 `step: 'items'`（见 routes.js）。

  注意标题是 `<h1>我的日记</h1>`，**没有** `(N)`：这条路线没有声明数量。
-->

</title></head>
<body>

      <!--

      -->
