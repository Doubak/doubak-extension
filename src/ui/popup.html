<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>豆备</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font: 13px/1.55 system-ui, -apple-system, "Noto Sans CJK SC", sans-serif;
    margin: 0; padding: 14px; width: 320px;
  }
  h1 { font-size: 14px; margin: 0 0 2px; }
  .sub { opacity: .65; margin: 0 0 12px; font-size: 12px; }

  #state { padding: 10px 12px; border-radius: 6px; margin-bottom: 12px; }
  .idle { background: #8881; }
  .run  { background: #e8f0fe; color: #174ea6; }
  .warn { background: #fef7e0; color: #8a6116; }
  .err  { background: #fce8e6; color: #a50e0e; }
  @media (prefers-color-scheme: dark) {
    .run  { background: #12233f; color: #a9c7f5; }
    .warn { background: #3a2e10; color: #f5d78e; }
    .err  { background: #3d1512; color: #f7b4ae; }
  }
  #state b { display: block; margin-bottom: 3px; }
  #state .why { font-size: 12px; opacity: .85; }

  table { border-collapse: collapse; width: 100%; margin-bottom: 12px; font-size: 12px; }
  td { padding: 3px 0; vertical-align: top; }
  td.k { opacity: .6; white-space: nowrap; padding-right: 10px; }
  .routes { font-size: 12px; margin-bottom: 12px; }
  .routes div { display: flex; justify-content: space-between; padding: 2px 0; gap: 8px; }
  .routes .hw { opacity: .65; font-variant-numeric: tabular-nums; }

  .actions { display: flex; gap: 8px; }
  button { font: inherit; padding: 7px 14px; cursor: pointer; flex: 1; }
  button:disabled { opacity: .5; cursor: default; }
  .note { font-size: 11px; opacity: .6; margin-top: 10px; }
</style>
</head>
<body>
  <h1>豆备</h1>
  <p class="sub">在你自己的浏览器里备份豆瓣</p>

  <div id="state" class="idle">正在读取状态…</div>

  <table id="stats" hidden></table>
  <div class="routes" id="routes"></div>

  <div class="actions">
    <button id="primary" disabled>…</button>
    <button id="panel">完整面板</button>
  </div>

  <p class="note" id="note"></p>

  <script type="module" src="./popup.js"></script>
</body>
</html>
