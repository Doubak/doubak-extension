<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>豆备 · 自检</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font: 14px/1.6 system-ui, -apple-system, "Noto Sans CJK SC", sans-serif;
    margin: 0 auto; padding: 24px; max-width: 900px;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { opacity: .7; margin: 0 0 20px; }
  button { font: inherit; padding: 8px 18px; cursor: pointer; }
  #summary { margin: 16px 0; padding: 12px 16px; border-radius: 6px; font-weight: 600; }
  .pass { background: #e6f4ea; color: #14622b; }
  .fail { background: #fce8e6; color: #a50e0e; }
  .run  { background: #e8f0fe; color: #174ea6; }
  @media (prefers-color-scheme: dark) {
    .pass { background: #10361c; color: #a8e5b8; }
    .fail { background: #3d1512; color: #f7b4ae; }
    .run  { background: #12233f; color: #a9c7f5; }
  }
  h2 { font-size: 15px; margin: 22px 0 6px; padding-bottom: 4px; border-bottom: 1px solid #8884; }
  .case { padding: 2px 0 2px 22px; position: relative; }
  .case::before { position: absolute; left: 2px; }
  .case.ok::before { content: "✔"; color: #1e8e3e; }
  .case.no::before { content: "✖"; color: #d93025; }
  .err { margin: 2px 0 6px 22px; padding: 6px 10px; background: #8881; border-radius: 4px;
         white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 12px; }
  .note { margin: 6px 0; padding: 6px 10px; background: #8881; border-radius: 4px; font-size: 13px; }
  table { border-collapse: collapse; margin: 8px 0; }
  td { padding: 3px 14px 3px 0; vertical-align: top; }
  td:first-child { opacity: .7; white-space: nowrap; }
</style>
</head>
<body>
  <h1>豆备 · 自检</h1>
  <p class="sub">
    在真实浏览器里验证 OPFS 存储、bundle 写入器与崩溃恢复。
    这些是 Node 测不到的部分——OPFS、持久化存储许可、配额，都只有浏览器里才有。
  </p>

  <button id="run">开始自检</button>
  <div id="summary" class="run" hidden></div>

  <h2>环境</h2>
  <div id="env"></div>

  <div id="results"></div>

  <script type="module" src="./main.js"></script>
</body>
</html>
